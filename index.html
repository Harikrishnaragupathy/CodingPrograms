const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function hl(code){
  // Single-pass tokenizer: walks the raw source once, so matched tokens
  // (comments/strings/keywords/types) can never get re-matched or corrupted
  // by a later pass, and every other character is escaped exactly as-is.
  const kws = ["class","public","static","void","int","char","boolean","String","if","else","for","while","new","return","import","try","catch","throw","throws","extends","implements","interface","protected","true","false","this"];
  const types = ["System","Arrays","Collections","Integer","Thread","Runnable","Scanner","Exception","LinkedHashMap","LinkedHashSet","HashSet","List","ArrayList","Set","Map","StringBuilder"];

  const pattern = new RegExp(
    "(//.*)" +                              // group1: line comment
    "|(\"(?:[^\"\\\\]|\\\\.)*\")" +         // group2: string literal
    "|\\b(" + kws.join("|") + ")\\b" +      // group3: keyword
    "|\\b(" + types.join("|") + ")\\b",     // group4: type/class name
    "g"
  );

  let result = "";
  let lastIndex = 0;
  let m;
  while ((m = pattern.exec(code)) !== null) {
    result += esc(code.slice(lastIndex, m.index));
    if (m[1] !== undefined)      result += `<span class="cm">${esc(m[1])}</span>`;
    else if (m[2] !== undefined) result += `<span class="str">${esc(m[2])}</span>`;
    else if (m[3] !== undefined) result += `<span class="kw">${esc(m[3])}</span>`;
    else if (m[4] !== undefined) result += `<span class="typ">${esc(m[4])}</span>`;
    lastIndex = pattern.lastIndex;
  }
  result += esc(code.slice(lastIndex));
  return result;
}

{ title:"Armstrong Number", tag:"math", code:
`// Online Java Compiler
// Use this editor to write, compile and run your Java code online

class Main {
    public static void main(String[] args) {
    int num = 153;
    int temp = num;
    int sum = 0;

    while (num > 0) {
        int digit = num % 10;
        sum = sum + (digit * digit * digit);
        num = num / 10;
    }

    if (sum == temp) {
        System.out.println("Armstrong Number");
    } else {
        System.out.println("Not Armstrong Number");
    }
    }
}`,
output:"Armstrong Number",
explain:`Extracts each digit with <code>num % 10</code>, cubes it, and adds it to <code>sum</code>, then removes that digit with <code>num / 10</code>. If the total of the cubed digits equals the original number, it's an Armstrong number. 153 = 1³ + 5³ + 3³.`
},
{ title:"Consecutive Character Check", tag:"string", code:
`// Online Java Compiler

import java.util.*;
class Main {
    public static void main(String[] args) {
        System.out.print(Check("bba"));
    }
    public static boolean Check(String Vals){

        int [] count = new int[26];

        for(char ch : Vals.toCharArray()){
            count[ch-'a']++;
        }

        for (int i=0;i<26;i++){
            if(count[i] > 0 && count[i] != i + 1) {
            return false;
            }
        }
        return true;
    }
}`,
output:"true",
explain:`Counts frequency of each letter a–z into <code>count[26]</code> using <code>ch-'a'</code> as the index. Then checks a quirky rule: whenever a letter appears, its frequency must equal its position + 1 (a→1 time, b→2 times, etc). For "bba": 'a' appears once (matches i=0→1) and 'b' appears twice (matches i=1→2), so it returns <code>true</code>.`

`// Online Java Compiler

class BinarySearch {
    public static void main(String[] args) {
        int [] a={1,2,3,4,5};
        int find=3;

        int low=0;
        int high=a.length-1;
        while(low <= high){
            int mid=(low+high)/2;
            if(a[mid]==find){
                System.out.print("Match Found index of =="+mid);
            }
            if(find>a[mid]){
                low=mid+1;
            }else{
                high=mid-1;
            }
        }
    }
}`,
output:"Match Found index of ==2",
explain:`Classic divide-and-conquer search on a sorted array. Repeatedly checks the middle element; if the target is larger, search moves right (<code>low=mid+1</code>), if smaller, it moves left (<code>high=mid-1</code>). Finds 3 at index 2 in O(log n) time.`

{ title:"LinkedHashMap as an LRU Cache", tag:"collections", code:
`import java.util.*;

public class Main {
    public static void main(String[] args) {
LinkedHashMap<Integer, String> cache =
new LinkedHashMap<>(3, 0.75f, true) {
protected boolean removeEldestEntry(Map.Entry<Integer, String> e) {
        return size() > 3;
    }
};

    cache.put(1, "A");
    cache.put(2, "B");
    cache.put(3, "C");

    cache.get(1);      // use 1

    System.out.println(cache);
    }
}`,
output:"{3=C, 1=A, 4=D}",
explain:`The <code>true</code> flag enables access-order mode, so recently-used entries move to the end. Overriding <code>removeEldestEntry()</code> to return <code>true</code> once <code>size() > 3</code> makes the map automatically evict the least-recently-used entry — a textbook LRU cache in a few lines.`

{ title:"Diamond / Pyramid Letter Pattern", tag:"pattern", code:
`// Online Java Compiler
// Use this editor to write, compile and run your Java code online
import java.util.*;
class Main {
    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        System.out.print("Enter number of rows: ");
        int n = sc.nextInt();
        //Upper Part
        for(int i=1;i<n;i++){
            //Space
            for(int j=n;j>i;j--){
                System.out.print(" ");
            }
            //Content
            for(char ch='A';ch<'A'+i;ch++){
                System.out.print(ch+" ");
            }
            System.out.println();
        }
        //Lower Part
        for(int i=n-1;i>=1;i--){
            //Space
            for(int j=n;j>i;j--){
                System.out.print(" ");
            }
            //Content
            for(char ch='A';ch<'A'+i;ch++){
                System.out.print(ch+" ");
            }
            System.out.println();
        }
    }
}`,

{ title:"Producer–Consumer (Simplified)", tag:"thread", code:
`class ProducerConsumer {
    int item;
    boolean available = false;

    void produce(int value) {
        item = value;
        available = true;
        System.out.println("Produced: " + item);
    }

    void consume() {
        if (available) {
            System.out.println("Consumed: " + item);
            available = false;
        }
    }

    public static void main(String[] args) {
        ProducerConsumer pc = new ProducerConsumer();

        pc.produce(10);
        pc.consume();
    }
}`,
output:"Produced: 10\nConsumed: 10",
explain:`A simplified (non-concurrent) sketch of the classic producer-consumer pattern. <code>produce()</code> sets a shared <code>item</code> and flips an <code>available</code> flag; <code>consume()</code> only reads the item if <code>available</code> is true, then resets the flag. A real implementation would add thread synchronization (<code>wait()</code>/<code>notify()</code> or locks).`
},

// ---------------------------------------------------------------
// Render
// ---------------------------------------------------------------
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('emptyState');
const counterEl = document.getElementById('counter');
const filtersEl = document.getElementById('filters');

const tagLabels = {
  all:"All", array:"Arrays", string:"Strings", collections:"Collections",
  oop:"OOP", thread:"Threads", exception:"Exceptions", math:"Math", pattern:"Patterns"
};
const tagsInUse = ["all", ...new Set(data.map(d=>d.tag))];
let activeTag = "all";

function renderFilters(){
  filtersEl.innerHTML = tagsInUse.map(t =>
    `<div class="chip ${t===activeTag?'active':''}" data-tag="${t}">${tagLabels[t]||t}</div>`
  ).join('');
  filtersEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeTag = chip.dataset.tag;
      renderFilters();
      renderList();
    });
  });
}

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  listEl.innerHTML = "";
  let shown = 0;

  data.forEach((item, i) => {
    const matchesTag = activeTag === "all" || item.tag === activeTag;
    const haystack = (item.title + " " + item.tag + " " + item.explain + " " + item.code).toLowerCase();
    const matchesSearch = !q || haystack.includes(q);
    if(!matchesTag || !matchesSearch) return;
    shown++;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div class="idx">${i+1}</div>
        <div class="head-text">
          <p class="head-title">${item.title}</p>
          <p class="head-tag">${tagLabels[item.tag]||item.tag}</p>
        </div>
        <div class="chevron">▶</div>
      </div>
      <div class="card-body">
        <div class="section-label">Code</div>
        <pre class="code"><code>${hl(item.code)}</code></pre>
        <div class="section-label">Output</div>
        <div class="output-box">${esc(item.output)}</div>
        <div class="section-label">Explanation</div>
        <p class="explain">${item.explain}</p>
      </div>
    `;
    card.querySelector('.card-head').addEventListener('click', ()=>{
      card.classList.toggle('open');
    });
    listEl.appendChild(card);
  });

  counterEl.textContent = shown + " / " + data.length + " programs";
  emptyEl.style.display = shown === 0 ? 'block' : 'none';
}

document.getElementById('search').addEventListener('input', renderList);
document.getElementById('expandAll').addEventListener('click', ()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.add('open'));
});
document.getElementById('collapseAll').addEventListener('click', ()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('open'));
});

renderFilters();
renderList();
</script>
